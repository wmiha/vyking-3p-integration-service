# Local stack: MySQL + Flyway migrations + the service.
#
#   make up      build and start everything (waits until healthy)
#   make down    stop, keep data
#   make clean   stop and delete the data volume (fresh start)
#
# All credentials below are dummy values for local development only.
name: vyking-3pi

services:
  mysql:
    image: mysql:8.4.13
    command:
      # Tuned for small developer machines; production sizing is a DBA concern.
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --skip-name-resolve
      - --max-connections=100
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-dev-only}
      MYSQL_DATABASE: ${DB_NAME:-vyking}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql # survives restarts; `make clean` removes it
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
      start_interval: 1s # poll fast while starting, then every interval
    mem_limit: 640m

  flyway:
    image: flyway/flyway:13.12.1-alpine
    command: migrate
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/${DB_NAME:-vyking}?allowPublicKeyRetrieval=true&useSSL=false
      FLYWAY_USER: root
      FLYWAY_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-dev-only}
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations,filesystem:/flyway/callbacks
      FLYWAY_CONNECT_RETRIES: "30"
      FLYWAY_PLACEHOLDERS_APP_USER: ${DB_USER:-app}
      FLYWAY_PLACEHOLDERS_APP_PASSWORD: ${DB_PASSWORD:-app-dev-only}
      JAVA_ARGS: -Xmx128m
    volumes:
      - ./db/migrations:/flyway/migrations:ro
      - ./db/callbacks:/flyway/callbacks:ro
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 384m

  # Stand-in for Acme Support (contract, per-key accounts, 60/min + burst 10
  # rate limit with Retry-After). Inspect it at localhost:8081/_debug/contacts.
  acmemock:
    build:
      context: .
      target: acmemock
    image: vyking-acmemock:local
    command:
      - -addr=:8081
      - -rate=${ACME_MOCK_RATE:-60}
      - -burst=${ACME_MOCK_BURST:-10}
      - -latency-min=${ACME_MOCK_LATENCY_MIN:-20ms}
      - -latency-max=${ACME_MOCK_LATENCY_MAX:-200ms}
      - -fail-rate=${ACME_MOCK_FAIL_RATE:-0}
    environment:
      ACME_MOCK_KEYS: ${ACME_API_KEY_BRAND_1:-acme-key-brand-1-dev-only},${ACME_API_KEY_BRAND_2:-acme-key-brand-2-dev-only}
    ports:
      - "${ACME_MOCK_PORT:-8081}:8081"
    mem_limit: 64m

  app:
    build:
      context: .
      target: server
      args:
        VERSION: ${VERSION:-dev}
    image: vyking-3p-integration-service:local
    environment:
      APP_ENV: local
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-vyking}
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app-dev-only}
      ACME_BASE_URL: ${ACME_BASE_URL:-http://acmemock:8081}
      ACME_API_KEY_BRAND_1: ${ACME_API_KEY_BRAND_1:-acme-key-brand-1-dev-only}
      ACME_API_KEY_BRAND_2: ${ACME_API_KEY_BRAND_2:-acme-key-brand-2-dev-only}
      SYNC_ENABLED: ${SYNC_ENABLED:-true}
    ports:
      - "${PUBLIC_PORT:-8080}:8080"
      - "${INTERNAL_PORT:-9090}:9090"
    depends_on:
      flyway:
        condition: service_completed_successfully
      acmemock:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    # Must exceed drain_delay + shutdown_timeout from the config.
    stop_grace_period: 60s
    mem_limit: 128m

  # Optional monitoring (`make obs-up`): Prometheus scrapes app:9090/metrics,
  # Grafana at localhost:3000 shows the provisioned "Vyking 3P integration"
  # dashboard. Off by default to spare memory.
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    depends_on:
      - app
    mem_limit: 256m

  grafana:
    image: grafana/grafana:13.2.6
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # local only
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-dev-only}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/vyking.json
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    mem_limit: 256m

volumes:
  mysql-data:
