# dev environment. Mounted as a ConfigMap in Kubernetes; secrets are
# injected as environment variables and referenced as ${VAR} placeholders.
app:
  name: vyking-3p-integration-service
  env: dev

log:
  level: ${LOG_LEVEL:-debug}
  format: json

server:
  # terminationGracePeriodSeconds must exceed drain_delay + shutdown_timeout.
  shutdown_timeout: 45s
  drain_delay: 5s # let the endpoints controller remove the pod first
  readiness_timeout: 2s # per /ready dependency check
  public:
    enabled: ${PUBLIC_ENABLED:-true}
    addr: ":8080"
    read_header_timeout: 5s
    read_timeout: 10s
    write_timeout: 15s
    idle_timeout: 60s
  internal: # ClusterIP only, never exposed through the ingress
    addr: ":9090"
    read_header_timeout: 5s
    read_timeout: 10s
    write_timeout: 15s
    idle_timeout: 60s

# Runtime profiler on the internal server, behind HTTP Basic auth. Enabling it
# requires PPROF_USERNAME and PPROF_PASSWORD (min. 12 characters) from a secret.
pprof:
  enabled: ${PPROF_ENABLED:-false}
  username: "${PPROF_USERNAME:-}"
  password: "${PPROF_PASSWORD:-}"
  block_profile_rate: 0     # see runtime.SetBlockProfileRate; 0 disables
  mutex_profile_fraction: 0 # see runtime.SetMutexProfileFraction; 0 disables
