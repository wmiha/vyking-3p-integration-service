# Local development: `make run` on the host or the docker compose stack.
#
# Placeholders: ${VAR} is required, ${VAR:-default} falls back when VAR is
# unset or empty. Quote placeholders that must stay strings (secrets!).
app:
  name: vyking-3p-integration-service
  env: local

log:
  level: ${LOG_LEVEL:-debug}
  format: ${LOG_FORMAT:-text}

server:
  shutdown_timeout: 40s
  drain_delay: 0s # nothing routes traffic to a laptop
  readiness_timeout: 2s # per /ready dependency check
  public:
    enabled: ${PUBLIC_ENABLED:-true}
    addr: "${PUBLIC_ADDR:-:8080}"
    read_header_timeout: 5s
    read_timeout: 10s
    write_timeout: 15s
    idle_timeout: 60s
  internal:
    addr: "${INTERNAL_ADDR:-:9090}"
    read_header_timeout: 5s
    read_timeout: 10s
    write_timeout: 15s
    idle_timeout: 60s

# Runtime profiler on the internal server, behind HTTP Basic auth.
pprof:
  enabled: ${PPROF_ENABLED:-true}
  username: "${PPROF_USERNAME:-pprof}"
  password: "${PPROF_PASSWORD:-pprof-dev-only}"
  block_profile_rate: 0     # see runtime.SetBlockProfileRate; 0 disables
  mutex_profile_fraction: 0 # see runtime.SetMutexProfileFraction; 0 disables

# MySQL. Writes and every sync read go to the primary; partner API reads go to
# the replica when enabled (falls back to the primary otherwise).
database:
  startup_timeout: 30s # keep pinging the database this long before giving up
  query_timeout: 5s    # upper bound for a single repository call
  tx_max_retries: 3    # re-run transactions aborted by deadlock / lock wait timeout
  primary:
    host: "${DB_HOST:-127.0.0.1}"
    port: ${DB_PORT:-3306}
    name: "${DB_NAME:-vyking}"
    user: "${DB_USER:-app}"
    password: "${DB_PASSWORD:-app-dev-only}"
    timezone: UTC # DATETIME columns carry no zone; assumed UTC
    connect_timeout: 5s
    read_timeout: 30s
    write_timeout: 30s
    pool:
      max_open_conns: 10
      max_idle_conns: 5
      conn_max_lifetime: 30m
      conn_max_idle_time: 5m
  replica:
    enabled: ${DB_REPLICA_ENABLED:-false}
    host: "${DB_REPLICA_HOST:-127.0.0.1}"
    port: ${DB_REPLICA_PORT:-3306}
    name: "${DB_NAME:-vyking}"
    user: "${DB_REPLICA_USER:-app}"
    password: "${DB_REPLICA_PASSWORD:-app-dev-only}"
    timezone: UTC
    connect_timeout: 5s
    read_timeout: 30s
    write_timeout: 30s
    pool:
      max_open_conns: 10
      max_idle_conns: 5
      conn_max_lifetime: 30m
      conn_max_idle_time: 5m

# Partner API authentication: HS256 JWTs we issue to partners (see NOTES.md).
# `kid` selects the verification key so keys can be rotated: add the new key
# first, re-issue tokens, then remove the previous one. Empty slots are ignored.
auth:
  issuer: vyking-integration
  audience: vyking-partner-api
  leeway: 30s # tolerated clock skew
  keys:
    - kid: "${AUTH_KEY_ID:-local-1}"
      secret: "${AUTH_JWT_SECRET:-local-dev-only-jwt-secret-0123456789}"
    - kid: "${AUTH_PREVIOUS_KEY_ID:-}"
      secret: "${AUTH_PREVIOUS_JWT_SECRET:-}"

# Public partner API (GET /v1/transactions).
partner_api:
  default_limit: 20 # page size when the partner sends no limit ("recent" is not defined by the task)
  max_limit: 100    # largest page a partner may request

# Short-lived, in-process cache for partner lookups: support agents repeat the
# same lookup while handling a ticket. Per replica; see NOTES.md for Redis.
cache:
  enabled: ${CACHE_ENABLED:-true}
  ttl: 15s           # how stale a transaction page may be
  max_entries: 10000 # bounds memory (one entry per page)
  sweep_interval: 1m

# Acme Support API (outbound). Every brand has its own API key; Acme allows
# 60 requests/minute per key (burst 10) and answers may take up to 30s.
acme:
  base_url: "${ACME_BASE_URL:-http://localhost:8081}" # compose: the acmemock service
  request_timeout: 35s     # per attempt
  max_attempts: 3          # for timeouts, network errors and 5xx
  base_backoff: 1s
  max_backoff: 30s
  default_retry_after: 60s # when a 429 carries no usable Retry-After
  rate_per_minute: 55      # stay below 60/min: other clients may share the key
  burst: 10
  breaker_threshold: 5     # consecutive failed calls before pausing a brand
  breaker_cooldown: 1m
  auth_cooldown: 15m       # pause after the brand's key is refused (401/403)
  brands:                  # brands without a key are not synced
    - brand_id: 1
      api_key: "${ACME_API_KEY_BRAND_1:-acme-key-brand-1-dev-only}"
    - brand_id: 2
      api_key: "${ACME_API_KEY_BRAND_2:-acme-key-brand-2-dev-only}"
    - brand_id: 3
      api_key: "${ACME_API_KEY_BRAND_3:-}" # unset locally: shows unconfigured brands

# Scheduled contact sync (sync_queue -> Acme Support contacts).
sync:
  enabled: ${SYNC_ENABLED:-true}
  interval: 30s              # pause between cycles when there is no backlog
  batch_per_brand: 50        # entries per brand and cycle (~1 min of a brand's rate budget)
  workers_per_brand: 4       # concurrent customers per brand; Acme may take 30s per call
  job_timeout: 2m            # one customer including retries
  lock_name: vyking-3p-contact-sync # MySQL named lock: one syncing replica at a time
  lock_session_timeout: 300s # a vanished leader's lock is freed after this long; must exceed job_timeout + lock_check_interval
  lock_check_interval: 5s    # how often the leader re-checks it still holds the lock
  backoff_initial: 1m        # retry delay for customers Acme rejected; doubles per failure
  backoff_max: 1h
  lookup_before_create: false # true: adopt contacts created manually in Acme (one more call)
